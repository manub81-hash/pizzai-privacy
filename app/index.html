<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PizzAI — Télécharger l'app</title>
  <meta name="description" content="PizzAI - L'assistant intelligent pour des pizzas parfaites. Calculateur, Chef IA, Analyse photo.">
  <meta property="og:title" content="PizzAI — Ton pizzaiolo intelligent">
  <meta property="og:description" content="Calcule ta pâte, pose tes questions au Chef IA, analyse tes pizzas par photo. Gratuit !">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zorntek.fr/app">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0806; color: #f5f0e8;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .container { max-width: 440px; width: 100%; }
    .logo { font-size: 80px; margin-bottom: 20px; }
    h1 { font-size: 42px; font-weight: 800; margin-bottom: 6px; letter-spacing: -1px; }
    h1 span { color: #d4a44a; }
    .tagline { font-size: 17px; color: #8a7e6d; margin-bottom: 36px; line-height: 1.4; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #d4a44a20;
      border-top-color: #d4a44a; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .redirect-text { font-size: 14px; color: #8a7e6d; margin-bottom: 36px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .btn {
      display: block; width: 100%; max-width: 300px; padding: 16px 32px; border-radius: 14px;
      font-size: 17px; font-weight: 700; text-decoration: none;
      transition: opacity 0.2s; text-align: center;
    }
    .btn:hover { opacity: 0.85; }
    .btn-android { background: #d4a44a; color: #1a1410; }
    .btn-ios { background: #222; color: #f5f0e8; border: 1px solid #444; }
    .or { color: #8a7e6d; font-size: 13px; }
    .features {
      margin-top: 40px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    }
    .feature { font-size: 14px; color: #8a7e6d; }
    .feature span { display: block; font-size: 28px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍕</div>
    <h1>Pizz<span>AI</span></h1>
    <p class="tagline">L'assistant intelligent<br>pour des pizzas parfaites</p>
    <div class="spinner" id="spinner"></div>
    <p class="redirect-text" id="redirect-text">Redirection vers le store...</p>
    <div class="buttons">
      <a href="https://play.google.com/store/apps/details?id=com.zorntek.pizzai" class="btn btn-android">
        ▶ Google Play
      </a>
      <span class="or">ou</span>
      <a href="https://play.google.com/store/apps/details?id=com.zorntek.pizzai" class="btn btn-ios">
         App Store (bientôt)
      </a>
    </div>
    <div class="features">
      <div class="feature"><span>🧮</span>Calculateur</div>
      <div class="feature"><span>👨‍🍳</span>Chef IA</div>
      <div class="feature"><span>📸</span>Analyse photo</div>
      <div class="feature"><span>🌍</span>5 langues</div>
    </div>
  </div>
  <script>
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var playUrl = 'https://play.google.com/store/apps/details?id=com.zorntek.pizzai';
    var appStoreUrl = playUrl;

    if (isAndroid || isIOS) {
      var target = isAndroid ? playUrl : appStoreUrl;
      // Tentative 1 : intent Android (ouvre directement le Play Store app)
      if (isAndroid) {
        window.location.href = 'intent://details?id=com.zorntek.pizzai#Intent;scheme=market;package=com.android.vending;end';
      }
      // Fallback après 1.5s si l'intent n'a pas fonctionné
      setTimeout(function() {
        window.location.href = target;
      }, 1500);
    } else {
      // Desktop : cacher spinner
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('redirect-text').textContent = 'Scannez ou cliquez pour télécharger';
    }
  </script>
</body>
</html>
